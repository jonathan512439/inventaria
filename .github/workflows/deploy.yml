name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos y lint
        run: |
          npx tsc --noEmit
          npm run lint

      # Las variables NEXT_PUBLIC_* se incrustan en el bundle del cliente en tiempo de build.
      # Las secretas (service role, Gemini) viven solo en Cloudflare y se leen en runtime.
      - name: Build (Next.js → next-on-pages)
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Deploy
        run: npx wrangler pages deploy .vercel/output/static --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'inventaria' }} --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Falló: ${{ github.workflow }}"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Volvió a fallar: $run"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "El despliegue no se completó (commit ${{ github.sha }}). Ejecución: $run"; fi
